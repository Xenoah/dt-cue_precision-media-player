<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dt-cue Global Controls</title><link rel="stylesheet" href="options.css"></head><body><main><h1>dt-cue Global Controls</h1><p>プレイヤーを開き、拡張アイコンを押すとそのタブだけを操作します。再読み込み後は再接続してください。</p><button id="shortcuts">グローバルキー設定を開く</button><p>各操作の適用範囲を「グローバル」にしてください。DAWやOSと競合するキーは別の組み合わせに変更します。</p><h2>現在の割り当て</h2><div id="commands"></div><p id="status"></p><p class="note">任意サイトへの常時アクセス権限は要求しません。明示的に接続したタブにだけ、再生操作を送ります。音声・動画ファイルは読み取り・送信しません。</p></main><script src="options.js"></script></body></html>
