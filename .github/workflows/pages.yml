name: Deploy dt-cue to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify logic
        run: node --test tests/*.test.mjs
      - name: Package companion extension
        run: python3 tools/package.py
      - name: Check whether Pages has been enabled
        id: availability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/dt-cue-pages.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$status" = "200" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Enable GitHub Pages once in Settings > Pages > Source: GitHub Actions, then rerun this workflow.'
            echo 'GitHub Pages is not enabled yet. In Settings → Pages, choose GitHub Actions, then rerun Deploy dt-cue to GitHub Pages.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Pages availability check failed (HTTP ${status})."
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: steps.availability.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.availability.outputs.enabled == 'true'
        with:
          path: site
      - name: Deploy
        if: steps.availability.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
