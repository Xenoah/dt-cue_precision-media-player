name: Release dt-cue
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify player and extension
        run: node --test tests/*.test.mjs
      - name: Package release assets
        run: python3 tools/package.py
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          tag="v${version}"
          notes="docs/releases/${tag}.md"
          test -f "$notes"
          gh api "repos/${GH_REPO}/releases" > /tmp/dt-cue-releases.json
          if python3 - "$tag" <<'PY'
          import json, sys
          releases = json.load(open('/tmp/dt-cue-releases.json'))
          sys.exit(0 if any(r['tag_name'] == sys.argv[1] for r in releases) else 1)
          PY
          then
            echo "Release ${tag} already exists; preserving published assets."
            exit 0
          fi
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "dt-cue ${tag} — First release" \
            --notes-file "$notes" \
            --latest
